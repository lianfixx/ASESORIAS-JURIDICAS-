name: Validar metodologia
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener fuente sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA contrastado con repositorio oficial
        with:
          persist-credentials: false
      - name: Mostrar Python disponible
        run: python3 --version
      - name: Pruebas tecnicas sin API keys ni expedientes
        run: python3 -m unittest discover -s tests -v
      - name: Construir paquetes en almacenamiento temporal
        run: python3 scripts/build.py --output /tmp/milla-build
      - name: Conservar paquetes para revision y descarga
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, SHA contrastado con repositorio oficial
        with:
          name: milla-metodologia-${{ github.sha }}
          path: /tmp/milla-build/
          if-no-files-found: error
          retention-days: 30
