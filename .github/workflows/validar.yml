name: Validar skill propietaria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener contenido sin conservar credenciales
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pruebas de integración y controles auxiliares
        run: python3 -m unittest discover -s tests -v
      - name: Crear paquete y guía universal
        run: python3 scripts/build.py --output "$RUNNER_TEMP/milla-build"
      - name: Conservar paquete de esta revisión
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milla-asesoria-juridica-0.3.1
          path: ${{ runner.temp }}/milla-build/
          if-no-files-found: error
          retention-days: 7
