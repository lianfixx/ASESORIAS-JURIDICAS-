name: Validar portal de licenciamiento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener contenido sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verificar portal propietario
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            USO_Y_LICENCIA.md
            AVISO_VERSIONES_HISTORICAS.md
            MODELO_LICENCIA_PROFESIONAL.md
            SOLICITAR_LICENCIA.md
            SECURITY.md
            CHANGELOG.md
            AUDITORIA_LICENCIAMIENTO_0.3.0.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Falta archivo requerido: $file"; exit 1; }
          done
          for path in skills scripts tests PUBLIC_FILES.json NOTICE; do
            test ! -e "$path" || { echo "Contenido distribuible no permitido en el portal: $path"; exit 1; }
          done
          grep -q "Licencia Profesional" LICENSE
          grep -q "no es software abierto" README.md
          grep -q "versiones 0.2.0 y 0.2.1" AVISO_VERSIONES_HISTORICAS.md
          echo "Portal de licenciamiento verificado."
