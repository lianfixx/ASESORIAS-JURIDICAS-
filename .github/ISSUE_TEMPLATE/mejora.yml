name: Mejora desidentificada
description: Proponer una mejora sin datos de clientes ni expedientes reales.
title: "[Mejora] "
body:
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: No incluyo datos personales, hechos reidentificables, documentos de clientes ni secretos.
          required: true
  - type: textarea
    id: problema
    attributes:
      label: Regla afectada y problema
      description: Describe el fallo del metodo con un ejemplo sintetico.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Correccion propuesta y riesgo que resuelve
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Fuente oficial, fecha y limites de verificacion
  - type: textarea
    id: pruebas
    attributes:
      label: Prueba de regresion y revision profesional requerida
